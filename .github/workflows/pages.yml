name: Deploy Hugo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily, so the writing-habit grid on /posts/ shows today even on days with no push.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          # Pinned, and kept the same as HUGO_VERSION in the Cloudflare Pages project
          # that builds eming.io from this repo. Cloudflare's default (0.147.7) cannot
          # build this site, and a failed build there leaves eming.io on the last good one.
          # To upgrade Hugo, change both.
          hugo-version: '0.170.1'
          extended: true

      - name: Build
        env:
          TZ: Europe/Madrid   # "today" for the writing-habit grid
        run: hugo --minify -b "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
