name: Deploy Hugo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Rebuild every morning so the survey page (/survey/) picks up new arXiv papers.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      # The survey data is fetched at build time and never committed. The last
      # good snapshot is kept in the Actions cache (falling back to the one in
      # the repo), so an arXiv outage just means yesterday's data.
      - name: Restore last survey snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/survey.json
          key: survey-${{ github.run_id }}
          restore-keys: survey-

      - name: Fetch latest papers from arXiv
        run: python3 scripts/fetch_survey.py

      - name: Save survey snapshot
        uses: actions/cache/save@v4
        with:
          path: data/survey.json
          key: survey-${{ github.run_id }}

      - name: Build
        run: hugo --minify -b "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
