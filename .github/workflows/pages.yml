name: Deploy Hugo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Rebuild every morning so the survey page (/survey/) picks up new arXiv papers.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # only for the keep-alive step below

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      # The survey data is fetched at build time and never committed. The last
      # good snapshot is kept in the Actions cache (falling back to the one in
      # the repo), so an arXiv outage just means yesterday's data.
      - name: Restore last survey snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/survey.json
          key: survey-${{ github.run_id }}
          restore-keys: survey-

      - name: Fetch latest papers from arXiv
        run: python3 scripts/fetch_survey.py
        env:
          # optional repository secret: a Semantic Scholar API key avoids rate limits
          S2_API_KEY: ${{ secrets.S2_API_KEY }}

      - name: Save survey snapshot
        uses: actions/cache/save@v4
        with:
          path: data/survey.json
          key: survey-${{ github.run_id }}

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow through the API (no commit) keeps the daily run alive.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

      - name: Build
        run: hugo --minify -b "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
