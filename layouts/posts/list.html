{{ define "main" }}
  <h1 class="page-title">Writing</h1>
  <p class="page-sub">Notes on research, system design, and things I’m reading.</p>
  {{ $p := .Paginate .Pages.ByDate.Reverse }}
  <div class="cards two">
    {{ range $p.Pages }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </div>
  {{ partial "pagination.html" . }}
{{ end }}
