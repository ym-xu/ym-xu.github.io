<style>
@font-face{font-family:"TeX Gyre Pagella";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/texgyrepagella-regular.woff2") format("woff2")}
@font-face{font-family:"TeX Gyre Pagella";font-style:italic;font-weight:400;font-display:swap;src:url("/fonts/texgyrepagella-italic.woff2") format("woff2")}
:root{color-scheme:light;--desk:#ebebeb;--bg:#fff;--fg:#111;--mut:#555;--rule:#111;--bd:#e2e2e2;--ac:#1d4ed8}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--desk:#101010;--bg:#1b1b1b;--fg:#ebebeb;--mut:#a9a9a9;--rule:#d6d6d6;--bd:#333;--ac:#8ab4f8}}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--fg);font:17px/1.6 "TeX Gyre Pagella","Palatino","Palatino Linotype","Book Antiqua","Songti SC","Noto Serif SC",Georgia,serif}
.sheet{max-width:440px;margin:14vh auto 0;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.07);padding:1.6rem 2.2rem 2rem}
.brand{font-variant:small-caps;letter-spacing:.05em;font-size:1.1rem;padding-bottom:.4rem;border-bottom:.5px solid var(--rule);margin-bottom:1.4rem}
h1{font-size:1.5rem;font-weight:400;margin:0 0 .3rem}p{color:var(--mut);font-style:italic;font-size:.95rem;margin:0 0 1.2rem}
input{width:100%;box-sizing:border-box;font:inherit;padding:.5rem .7rem;border:1px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--fg)}
button{margin-top:.8rem;font:inherit;font-style:italic;color:var(--ac);background:none;border:0;padding:.2rem 0;cursor:pointer}
button:hover{text-decoration:underline;text-underline-offset:.15em}
#msg{min-height:1.4rem;margin-top:.4rem;font-size:.92rem;color:var(--mut)}
@media (max-width:520px){.sheet{margin:0;min-height:100vh;box-shadow:none}}
</style></head>
