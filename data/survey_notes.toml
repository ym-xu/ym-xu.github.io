# Editor's notes for the survey page: a short overview per subfield, classic
# papers from before the tracking window, and the core benchmarks.
# Every arXiv id below was checked against arXiv. Overviews describe paradigms
# and open problems only — no leaderboard numbers, which go stale in weeks.
# Set reviewed = true once you've read and edited them; until then the page
# labels them as a draft.

reviewed = false
updated = "2026-11-11"

[overview]
ocr = "Recognition moved from detect-then-recognise pipelines with CTC or attention decoders to end-to-end transformer readers, and now to unified models that read whole pages. Open problems: low-resource scripts, very dense or degraded pages, and judging OCR by what it does to downstream reasoning rather than character error alone."
docvqa = "Layout-aware pre-trained encoders (the LayoutLM line) gave way to OCR-free encoder–decoders (Donut, Pix2Struct) and then to general vision-language models tuned on document data. Open problems: grounding answers in visible evidence, hallucination on dense text, and the cost of high-resolution inputs."
rag = "Retrieval over page images — late-interaction VLM embeddings (ColPali) and screenshot embeddings (DSE) — has largely replaced OCR-then-text indexing, with retrieved pages handed to a VLM (VisRAG, M3DocRAG). Open problems: region-level rather than page-level evidence, the storage cost of multi-vector indexes, and cross-lingual collections."
agents = "The newest strand: models that plan, call tools (search, crop, OCR, code) and iterate over long documents or whole collections, increasingly trained with reinforcement learning. Open problems: cost and latency, faithful evidence trails, and evaluating the search trajectory rather than only the final answer."
longdoc = "Questions moved from one page to many: multi-page QA, slide decks and long PDFs. Methods combine page retrieval, hierarchical encoders and long-context VLMs. Open problems: reasoning across pages, pointing to where the answer is, and recognising unanswerable questions."
layout = "Usually framed as object detection on large annotated corpora (PubLayNet, DocLayNet), plus separate reading-order models. Open problems: robustness across domains and languages, and logical structure — headings, hierarchy, captions — beyond bounding boxes."
parsing = "End-to-end page-to-markup models (Nougat, unified OCR-2.0-style models) now compete with modular pipelines, and benchmarks such as OmniDocBench compare both. Open problems: getting text, tables, formulas and reading order right in one pass, and staying faithful on unusual layouts."
tables = "Table detection and structure recognition on large datasets (PubTabNet, PubTables-1M) with image-to-structure models (TableFormer), increasingly joined by table question answering with VLMs. Open problems: spanning and nested cells, tables split across pages, and numeric reasoning."
charts = "Question answering and reasoning over plots and charts (PlotQA, ChartQA), infographics, and chart-to-data or chart-to-code derendering with VLMs. Open problems: exact value extraction, misleading visualisations, and dense scientific figures."
kie = "Entity labelling and linking on forms and receipts (FUNSD, SROIE) with layout-aware models, now often generative extraction by VLMs. Open problems: generalising to unseen schemas, long and multi-page forms, and privacy-sensitive data."
historical = "Handwritten text-line and full-page recognition with transformer models, together with layout analysis and reading order for archives and newspapers. Open problems: low-resource scripts and languages, scarce transcriptions, and end-to-end page-level recognition."
imaging = "Document image restoration — dewarping, binarisation, shadow and illumination removal — and, more recently, generating text-rich images and detecting tampering. Open problems: judging restoration by downstream OCR, realistic synthetic data, and robustness to forgery."

