# Editor's notes for the survey page: a short overview per subfield, key
# references from before the tracking window, and the core benchmarks.
# Every arXiv id / DOI below was checked against arXiv or doi.org. Overviews
# describe paradigms and open problems only — no leaderboard numbers, which go
# stale in weeks — and cite the papers they lean on (markdown links).
# Set reviewed = true once you've read and edited them; until then the page
# labels them as a draft.

reviewed = false
updated = "2026-11-11"

[overview]
ocr = "Recognition moved from detect-then-recognise pipelines with CTC or attention decoders to end-to-end transformer readers ([TrOCR](https://arxiv.org/abs/2109.10282), [PARSeq](https://arxiv.org/abs/2207.06966)), and then to unified models that read whole pages ([GOT](https://arxiv.org/abs/2409.01704)). Open problems: low-resource scripts, very dense or degraded pages, and judging OCR by what it does to downstream reasoning rather than character error alone."
docvqa = "Layout-aware pre-trained encoders ([LayoutLM](https://arxiv.org/abs/1912.13318)) gave way to OCR-free encoder–decoders ([Donut](https://arxiv.org/abs/2111.15664), [Pix2Struct](https://arxiv.org/abs/2210.03347)) and then to general vision-language models tuned on document data, evaluated on benchmarks such as [DocVQA](https://arxiv.org/abs/2007.00398). Open problems: grounding answers in visible evidence, hallucination on dense text, and the cost of high-resolution inputs."
rag = "Embedding page images directly — late interaction over VLM patch embeddings ([ColPali](https://arxiv.org/abs/2407.01449)) or screenshot embeddings ([DSE](https://arxiv.org/abs/2406.11251)) — outperforms OCR-then-text indexing on visual-document retrieval benchmarks such as ViDoRe, and retrieved pages are increasingly handed straight to a VLM ([VisRAG](https://arxiv.org/abs/2410.10594), [M3DocRAG](https://arxiv.org/abs/2411.04952)). Open problems: region-level rather than page-level evidence, the storage cost of multi-vector indexes, and cross-lingual collections."
agents = "The newest strand: models that plan, call tools (search, crop, OCR, code) and iterate over long documents or whole collections ([ViDoRAG](https://arxiv.org/abs/2502.18017), [MDocAgent](https://arxiv.org/abs/2503.13964)), increasingly trained with reinforcement learning ([VRAG-RL](https://arxiv.org/abs/2505.22019)). Open problems: cost and latency, faithful evidence trails, and evaluating the search trajectory rather than only the final answer ([MADQA](https://arxiv.org/abs/2603.12180))."
longdoc = "Questions moved from one page to many: multi-page QA ([MP-DocVQA](https://arxiv.org/abs/2212.05935), [DUDE](https://arxiv.org/abs/2305.08455)), slide decks ([SlideVQA](https://arxiv.org/abs/2301.04883)) and long PDFs ([MMLongBench-Doc](https://arxiv.org/abs/2407.01523)). Methods combine page retrieval, hierarchical encoders and long-context VLMs. Open problems: reasoning across pages, pointing to where the answer is, and recognising unanswerable questions."
layout = "Usually framed as object detection on large annotated corpora ([PubLayNet](https://arxiv.org/abs/1908.07836), [DocLayNet](https://arxiv.org/abs/2206.01062)), with reading order handled by separate models ([LayoutReader](https://arxiv.org/abs/2108.11591)). Open problems: robustness across domains and languages, and logical structure — headings, hierarchy, captions — beyond bounding boxes."
parsing = "End-to-end page-to-markup models ([Nougat](https://arxiv.org/abs/2308.13418), [GOT](https://arxiv.org/abs/2409.01704)) now compete with modular pipelines, and benchmarks such as [OmniDocBench](https://arxiv.org/abs/2412.07626) compare the two. Open problems: getting text, tables, formulas and reading order right in one pass, and staying faithful on unusual layouts."
tables = "Table detection and structure recognition on large datasets ([PubTabNet](https://arxiv.org/abs/1911.10683), [PubTables-1M](https://arxiv.org/abs/2110.00061)) with image-to-structure models ([TableFormer](https://arxiv.org/abs/2203.01017)), increasingly joined by table question answering with VLMs. Open problems: spanning and nested cells, tables split across pages, and numeric reasoning."
charts = "Question answering and reasoning over plots and charts ([PlotQA](https://arxiv.org/abs/1909.00997), [ChartQA](https://arxiv.org/abs/2203.10244)) and infographics ([InfographicVQA](https://arxiv.org/abs/2104.12756)), plus chart-to-data and chart-to-code derendering with VLMs. Open problems: exact value extraction, misleading visualisations, and dense scientific figures."
kie = "Entity labelling and linking on forms and receipts ([FUNSD](https://arxiv.org/abs/1905.13538), [SROIE](https://arxiv.org/abs/2103.10213)) with layout-aware models ([LayoutLMv2](https://arxiv.org/abs/2012.14740)), now often generative extraction by VLMs. Open problems: generalising to unseen schemas, long and multi-page forms, and privacy-sensitive data."
historical = "Handwritten text-line and full-page recognition with transformer models ([Kang et al.](https://arxiv.org/abs/2005.13044)), on long-standing datasets such as [IAM](https://doi.org/10.1007/s100320200071), together with layout analysis and reading order for archives and newspapers. Open problems: low-resource scripts and languages, scarce transcriptions, and end-to-end page-level recognition."
imaging = "Document image restoration — dewarping and illumination correction ([DocTr](https://arxiv.org/abs/2110.12942)), shadow removal ([DocDeshadower](https://arxiv.org/abs/2307.15318)), binarisation — and, more recently, generating text-rich images and detecting tampering. Open problems: judging restoration by downstream OCR, realistic synthetic data, and robustness to forgery."

