# A short note on where my own research sits on this map (shown under the abstract).
[my_work]
subfields = ["agents", "longdoc", "rag"]
text = "My work sits where **agents** meet **long documents**, with a foot in retrieval. [MADQA](/publications/icml-madqa/) (ICML 2026, oral) is a benchmark for agentic question answering over document collections that scores the whole search trajectory, not just the answer — and shows agents reach human accuracy only by working about five times harder. [AdaNav](/publications/icdar-adanav/) (ICDAR 2026) builds a multimodal document tree and navigates it at query-adaptive granularity instead of relying on an embedding retriever."
