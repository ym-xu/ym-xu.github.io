baseURL = "https://ym-xu.github.io/"
title = "Yiming Xu"
languageCode = "en"
theme = "mu-min"
[pagination]
  pagerSize = 10
enableRobotsTXT = true

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Optional: suppress the warning if desired
ignoreLogs = ['warning-goldmark-raw-html']

[params]
  description = "Yiming Xu — PhD Fellow working on multimodal document understanding at the Computer Vision Center, Universitat Autònoma de Barcelona."
  showReadingTime = true
  enableDarkMode = true
  showToc = true
  plausibleDomain = ""

[params.author]
  name = "Yiming Xu"

# --- Home hero ---
[params.home]
  role = "PhD Fellow · Multimodal Document Understanding"
  affiliation = "Computer Vision Center, Universitat Autònoma de Barcelona"
  avatar = "images/avatar.jpg"   # a file under assets/ — resized and converted to WebP at build time
  # The highlighter: phrases of the bio (content/_index.md) it jumps between,
  # in any order (it plays them in reading order). Must match the text exactly.
  beat = 128   # tempo in BPM
  highlights = [
    "Vision & Language Group",
    "Dimosthenis Karatzas",
    "Ernest Valveny",
    "agentic document-understanding systems",
    "foundation models for document understanding",
    "University of Amsterdam",
    "Multimodal RAG",
    "principal developer",
    "e-commerce AI agents",
  ]
  # A theorem-style aside under the bio. Delete both lines to hide it.
  definitionTerm = "Document"
  definition = "A page is not an image; it is a tree of meaning that happens to be printed."
  # Email, never written out on the page or in this repo: the address reversed,
  # each character XOR 0x2a, as hex. The page shows only "email"; home.js decodes
  # it on click. To change it, run:
  #   python3 -c "a='you@example.org';print(''.join('%02x'%(ord(c)^0x2a) for c in a[::-1]))"
  emailCode = "5e4b4904484b5f04495c496a4d4443474353"
  cvUrl = "/cv.pdf"   # drop your CV at static/cv.pdf — the link only appears once that file exists
  [params.home.social]
    linkedin = "https://www.linkedin.com/in/yiming-xu-86371b201/"
    github = "https://github.com/ym-xu"
    scholar = "https://scholar.google.com/citations?user=n1skXDsAAAAJ&hl=en"
    twitter = "https://x.com/Yiming_xu_1104"

[params.giscus]
  repo = ""
  repo_id = ""
  category = "General"
  category_id = ""
  mapping = "pathname"
  reactions_enabled = "1"
  emit_metadata = "0"
  input_position = "bottom"
  theme = "light"
  lang = "en"

[privacy]
  [privacy.youtube]
    privacyEnhanced = true

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 5
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 10
  [[menu.main]]
    name = "Publications"
    url = "/publications/"
    weight = 20
  [[menu.main]]
    name = "Map"
    url = "https://ym-xu.github.io/living-survey/"
    weight = 25
  [[menu.main]]
    name = "Writing"
    url = "/posts/"
    weight = 30
